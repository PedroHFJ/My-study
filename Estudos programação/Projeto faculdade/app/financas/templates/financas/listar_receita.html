{% extends 'financas/base.html' %}
{% block content %}
<div class="panel">
  <h1>Minhas receitas</h1>
  <a href="{% url 'criar_receitas' %}" class="btn">+ Nova receita</a>
  <table>
    <thead><tr><th>Data</th><th>Descrição</th><th>Quantidade</th><th>Valor</th><th></th></tr></thead>
    <tbody>
      {% for r in receita %}
      <tr>
        <td>{{ r.data }}</td>
        <td>{{ r.descricao }}</td>
        <td>{{ r.quantidade_vendida }}</td>
        <td class="num">R$ {{ r.valor }}</td>
        <td>
          <a href="{% url 'editar_receita' r.pk %}">editar</a>
          <a href="{% url 'excluir_receita' r.pk %}">excluir</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
